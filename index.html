<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cell Reproduction and Genetics: Study Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,700;1,7..72,500&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens: a stained-slide palette (hematoxylin purple, eosin pink, pea green) ---------- */
:root{
  --bg:#F7F5FC; --surface:#FFFFFF; --surface2:#EFEBF9; --ink:#1F1A3D; --ink2:#4A4470; --line:#D9D3EC;
  --hema:#4B3BA3; --on-hema:#FFFFFF; --hema-soft:#E6E1F7;
  --eosin:#C93A74; --eosin-text:#A32459; --eosin-soft:#FBE3EC;
  --pea:#3F7D2E; --pea-soft:#E3F1DC;
  --amber:#7A4F00; --amber-soft:#FFF1D0;
  --flower:#8E6FD1;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15112B; --surface:#1E1941; --surface2:#272152; --ink:#EDEAFA; --ink2:#B9B2DD; --line:#3A3470;
    --hema:#B3A8FF; --on-hema:#15112B; --hema-soft:#2E2766;
    --eosin:#FF8FB8; --eosin-text:#FF8FB8; --eosin-soft:#4A1F37;
    --pea:#8FD27A; --pea-soft:#23401E;
    --amber:#F2C265; --amber-soft:#3E3012;
    --flower:#A98BEB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15112B; --surface:#1E1941; --surface2:#272152; --ink:#EDEAFA; --ink2:#B9B2DD; --line:#3A3470;
  --hema:#B3A8FF; --on-hema:#15112B; --hema-soft:#2E2766;
  --eosin:#FF8FB8; --eosin-text:#FF8FB8; --eosin-soft:#4A1F37;
  --pea:#8FD27A; --pea-soft:#23401E;
  --amber:#F2C265; --amber-soft:#3E3012;
  --flower:#A98BEB;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 72px); -webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--sans);min-height:100vh}
h1,h2,h3{font-family:var(--serif);line-height:1.22;margin:0}
h1{font-size:2.05rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.25rem;font-weight:700}
h4{font:700 1.05rem/1.3 var(--sans);margin:0 0 6px}
p{margin:0 0 .9em;max-width:68ch}
ul,ol{margin:0 0 1em;padding-left:1.25em;max-width:68ch}
li{margin:.25em 0}
a{color:var(--hema);text-underline-offset:3px}
strong{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--eosin);outline-offset:2px;border-radius:4px}
.gt{font-family:var(--serif);font-style:italic;font-weight:500;letter-spacing:.02em;white-space:nowrap}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:304px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top, 0px);align-self:start;height:calc(100vh - env(safe-area-inset-top, 0px));overflow:auto;
  background:var(--surface);border-right:1px solid var(--line);padding:22px 16px 28px}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 20px}
.topbar .where{flex:1;min-width:0;font-size:.92rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .where strong{color:var(--ink)}
.iconbtn{font:700 .9rem var(--sans);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.iconbtn:hover{border-color:var(--hema)}
#pathbtn{display:none}
.page{width:100%;max-width:800px;margin:0 auto;padding:28px 20px 56px;flex:1}
.scrim{display:none}

.brand{font:700 1.05rem/1.25 var(--serif);margin:0 0 4px}
.brand-sub{font-size:.85rem;color:var(--ink2);margin:0 0 18px;max-width:none}
.rail h2{font:700 .95rem/1.2 var(--sans);margin:20px 0 8px;color:var(--ink2)}
.rail .phase-note{font-size:.82rem;color:var(--ink2);margin:-2px 0 8px;max-width:none;line-height:1.4}
.nav{list-style:none;margin:0;padding:0}
.nav li{margin:2px 0}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.95rem;line-height:1.3}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current="page"]{background:var(--hema-soft);font-weight:700}
.nav a.locked{color:var(--ink2)}
.nav .meta{margin-left:auto;font-size:.78rem;color:var(--ink2);white-space:nowrap}
.dot{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--hema);background:transparent}
.dot.half{background:linear-gradient(90deg,var(--hema) 50%,transparent 50%)}
.dot.done{background:var(--hema)}
.dot.lock{border-style:dashed;border-color:var(--ink2)}

/* ---------- Guide bar: always says what to do next ---------- */
.guide{position:sticky;bottom:0;z-index:18;background:var(--surface);border-top:3px solid var(--hema);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
  display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.guide .msg{flex:1;min-width:220px;font-size:.95rem;line-height:1.4}
.guide .msg strong{display:block;font-size:.82rem;color:var(--ink2);font-weight:700}
.guide .acts{display:flex;gap:8px;flex-wrap:wrap}

.btn{font:700 1rem/1.2 var(--sans);padding:12px 18px;border-radius:8px;border:2px solid var(--hema);background:var(--hema);color:var(--on-hema);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--hema)}
.btn.sm{padding:8px 12px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--hema);font:inherit;text-decoration:underline;cursor:pointer;padding:0;text-underline-offset:3px}

/* ---------- Page head ---------- */
.kicker{font-size:.92rem;color:var(--ink2);margin:0 0 6px}
.lede{font-size:1.1rem;color:var(--ink);margin:12px 0 0}
.objectives{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--pea);padding:14px 18px;margin:20px 0 6px;border-radius:2px 10px 10px 2px}
.objectives h2{font:700 1rem/1.3 var(--sans);margin:0 0 6px}
.objectives ul{margin:0}

/* ---------- Tabs (selective depth) ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:24px 0 0;border-bottom:2px solid var(--line)}
.tabs a{display:flex;gap:8px;align-items:center;padding:10px 14px;border:2px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;color:var(--ink2);text-decoration:none;font-weight:700;font-size:.97rem;margin-bottom:-2px}
.tabs a:hover{color:var(--ink);background:var(--surface2)}
.tabs a[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--line);border-bottom:2px solid var(--surface)}
.tabs .n{font-size:.78rem;background:var(--surface2);color:var(--ink2);border-radius:999px;padding:2px 8px}
.tabs .tick{color:var(--pea);font-weight:700}
.tabguide{margin:20px 0 26px;padding:12px 16px;background:var(--surface2);border-radius:8px;font-size:.97rem;max-width:none}
.tier{display:inline-block;font:700 .8rem/1 var(--sans);padding:5px 10px;border-radius:999px;vertical-align:middle}
.t-core{background:var(--hema);color:var(--on-hema)}
.t-sup{background:var(--eosin-soft);color:var(--eosin-text)}
.t-oth{background:var(--surface2);color:var(--ink2)}

.core-item{border-left:6px solid var(--hema);padding:2px 0 6px 20px;margin:0 0 46px}
.core-item h3{font-size:1.5rem;margin:0 0 12px}
.sup-item{border-left:3px solid var(--eosin);padding:0 0 0 16px;margin:0 0 26px;font-size:.98rem}
.sup-item h4{font-size:1.08rem}
.oth{margin:0;display:grid;gap:0}
.oth-row{display:grid;grid-template-columns:minmax(120px,210px) 1fr;gap:6px 18px;padding:10px 0;border-top:1px solid var(--line);font-size:.93rem}
.oth-row dt{font-weight:700;margin:0}
.oth-row dd{margin:0;color:var(--ink)}
.src{font-size:.82rem;color:var(--ink2);margin:8px 0 0;max-width:none}
.src::before{content:"Slides: "}
.oth-row .src{display:inline;margin-left:6px}

.callout{margin:16px 0;padding:12px 16px;border-radius:8px;font-size:.96rem;max-width:68ch}
.callout.note{background:var(--hema-soft)}
.callout.warn{background:var(--amber-soft);color:var(--ink);border-left:5px solid var(--amber)}
.callout.warn strong:first-child{color:var(--amber)}
.callout.link{background:var(--pea-soft);border-left:5px solid var(--pea)}
.callout.link strong:first-child{color:var(--pea)}
.callout p:last-child{margin-bottom:0}

details.explain{margin:16px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:68ch}
details.explain summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:.96rem;list-style:none}
details.explain summary::-webkit-details-marker{display:none}
details.explain summary::before{content:"+";display:inline-block;width:1.2em;color:var(--hema);font-weight:700}
details.explain[open] summary::before{content:"\2212"}
details.explain .ans{padding:0 16px 12px 16px;font-size:.96rem}
details.explain .ans p:last-child{margin-bottom:0}
details.step{margin:8px 0;border:1px dashed var(--line);border-radius:8px;padding:0}
details.step summary{cursor:pointer;padding:8px 12px;font-size:.93rem;color:var(--hema);font-weight:700}
details.step .body{padding:0 12px 10px}

figure{margin:20px 0;padding:0}
figure .fig{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto}
figure svg{display:block;width:100%;height:auto;min-width:520px}
figure svg.narrow{min-width:300px;max-width:420px;margin:0 auto}
figcaption{font-size:.88rem;color:var(--ink2);margin-top:8px;max-width:68ch}

.tbl{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--surface2);font-weight:700}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* svg classes */
.sv-t{font:400 13px var(--sans);fill:var(--ink)}
.sv-t2{font:400 12px var(--sans);fill:var(--ink2)}
.sv-b{font:700 13px var(--sans);fill:var(--ink)}
.sv-gt{font:italic 500 15px var(--serif);fill:var(--ink)}
.sv-line{fill:none;stroke:var(--ink2);stroke-width:2;stroke-linecap:round}
.sv-thin{fill:none;stroke:var(--ink2);stroke-width:1.2}
.sv-cell{fill:var(--surface2);stroke:var(--ink2);stroke-width:2}
.sv-nuc{fill:var(--hema-soft);stroke:var(--hema);stroke-width:2}
.sv-arrow{fill:none;stroke:var(--ink2);stroke-width:2}
.sv-seg{cursor:pointer;stroke:var(--surface);stroke-width:3}
.sv-seg:hover,.sv-seg:focus{filter:brightness(1.12)}
.sv-seg.on{stroke:var(--ink);stroke-width:3}

/* stage viewer */
.stagebar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.stagebar button{font:700 .88rem var(--sans);padding:7px 11px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.stagebar button[aria-pressed="true"]{background:var(--hema);color:var(--on-hema);border-color:var(--hema)}
.stagebox{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.stagebox .desc ul{padding-left:1.1em;margin:6px 0}
.stagebox .desc h4{font-size:1.1rem;font-family:var(--serif)}
.stagebox svg{min-width:0;max-width:380px;margin:0 auto}

/* lab */
.lab{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:18px 0}
.lab h4{font-family:var(--serif);font-size:1.1rem}
.lab .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.lab label{display:flex;flex-direction:column;font-size:.85rem;color:var(--ink2);gap:3px;font-weight:700}
.lab select{font:inherit;font-size:1rem;padding:8px 10px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:110px}
.lab .presets{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.lab .presets button{font:700 .82rem var(--sans);padding:6px 10px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.lab .presets button:hover{border-color:var(--hema)}
.pun{border-collapse:separate;border-spacing:4px;margin:10px 0;font-size:.95rem;width:auto}
.pun th,.pun td{border:0;text-align:center;padding:7px 9px;border-radius:6px;min-width:50px}
.pun th{background:transparent;font-family:var(--serif);font-style:italic}
.pun td{font-family:var(--serif);font-style:italic;font-weight:500}
.pun.di td{padding:6px 5px;min-width:44px;font-size:.85rem}
.p-a{background:var(--hema-soft)} .p-b{background:var(--pea-soft)} .p-c{background:var(--amber-soft)} .p-d{background:var(--eosin-soft)}
.lab .res{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:8px}
.lab .res h5{margin:0 0 4px;font:700 .9rem var(--sans)}
.lab .res ul{margin:0;padding-left:1.1em;font-size:.92rem}
.swatch{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}

/* progress */
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pea)}
.bar.hema>i{background:var(--hema)}

/* start page */
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0;padding:0;list-style:none;max-width:none}
.phases li{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--hema);padding:12px 14px;margin:0;border-radius:2px 2px 10px 10px}
.phases li:nth-child(2){border-top-color:var(--eosin)}
.phases li:nth-child(3){border-top-color:var(--pea)}
.phases h3{font-size:1.05rem;margin:0 0 4px}
.phases p{font-size:.92rem;margin:0}
.depth{display:grid;gap:10px;margin:12px 0;max-width:none}
.depth>div{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start;font-size:.96rem}
.plan{margin:12px 0}
.plan td:first-child{white-space:nowrap;font-weight:700}
.modlist{list-style:none;padding:0;margin:14px 0;max-width:none;display:grid;gap:8px}
.modlist li{margin:0}
.modlist a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none}
.modlist a:hover{border-color:var(--hema)}
.modlist .mn{font:700 1.2rem var(--serif);color:var(--hema);width:1.6em}
.modlist .mt{font-weight:700}
.modlist .ms{font-size:.88rem;color:var(--ink2)}

/* review */
.decks{list-style:none;padding:0;margin:14px 0;max-width:none;display:grid;gap:10px}
.deck{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.deck.lockd{opacity:.8;background:var(--surface2)}
.deck h3{font:700 1.02rem var(--sans)}
.deck .stats{font-size:.86rem;color:var(--ink2)}
.deck .bar{grid-column:1 / -1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{font:700 .86rem var(--sans);padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--hema);color:var(--on-hema);border-color:var(--hema)}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0;align-items:end;max-width:560px}
.boxes div{text-align:center;font-size:.8rem;color:var(--ink2)}
.boxes .col{height:70px;display:flex;align-items:flex-end;justify-content:center;background:var(--surface2);border-radius:6px;overflow:hidden}
.boxes .col i{display:block;width:100%;background:var(--hema)}
.boxes b{display:block;color:var(--ink);font-size:.95rem}

.sess-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sess-head .meta{font-size:.9rem;color:var(--ink2)}
.fc-wrap{perspective:1400px;margin:14px 0}
.fc{display:grid;transform-style:preserve-3d;transition:transform .5s;min-height:300px}
.fc.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.face.back{transform:rotateY(180deg);border-color:var(--hema)}
.face .tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--ink2)}
.face .q{font:500 1.28rem/1.4 var(--serif);flex:1}
.face .a{font-size:1.05rem;flex:1}
.face .a p{max-width:none}
.face .why{font-size:.9rem;color:var(--ink2);border-top:1px solid var(--line);padding-top:8px}
.face textarea{width:100%;min-height:70px;font:inherit;padding:10px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.face .typed{font-size:.92rem;background:var(--surface2);padding:8px 10px;border-radius:8px;color:var(--ink2);white-space:pre-wrap}
.face .typed b{color:var(--ink)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 0}
.rate button{font:700 1rem var(--sans);padding:14px 8px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.rate button small{display:block;font-weight:400;font-size:.78rem;color:var(--ink2)}
.rate .miss:hover{border-color:var(--eosin)} .rate .shaky:hover{border-color:var(--amber)} .rate .got:hover{border-color:var(--pea)}
.flipbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q .tbl,.a .tbl{font-size:.9rem;font-family:var(--sans)}
.qopts{font:400 1rem/1.5 var(--sans);margin:8px 0 0;padding-left:0;list-style:none}
.qopts li{margin:2px 0}

/* reference */
.gloss-search{width:100%;max-width:420px;font:inherit;padding:10px 12px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);margin:6px 0 14px}
.gl{margin:0;padding:0;list-style:none;max-width:none}
.gl li{padding:10px 0;border-top:1px solid var(--line);margin:0;display:grid;grid-template-columns:minmax(130px,220px) 1fr;gap:4px 18px}
.gl b{font-weight:700}
.gl .where{font-size:.8rem;color:var(--ink2);display:block}
.refnav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
.refnav a{padding:8px 12px;border:2px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);font-weight:700;font-size:.9rem}
.refnav a[aria-current="page"]{background:var(--hema);color:var(--on-hema);border-color:var(--hema)}
.notes{list-style:none;padding:0;margin:0;max-width:none}
.notes li{border-left:5px solid var(--amber);background:var(--surface);border-radius:2px 10px 10px 2px;padding:12px 16px;margin:0 0 12px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.notes h3{font:700 1rem var(--sans);margin-bottom:4px}
.notes p{font-size:.95rem;margin:0 0 .5em}
.refs{font-size:.9rem;padding-left:1.2em}
.refs li{margin:.5em 0}

@media (max-width:900px){
  .app{display:block}
  #pathbtn{display:inline-block}
  .rail{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(86vw,330px);z-index:50;transform:translateX(-104%);transition:transform .25s;
    padding-top:calc(22px + env(safe-area-inset-top, 0px));padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px));box-shadow:0 0 40px rgba(0,0,0,.25)}
  .rail.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(10,8,30,.5);z-index:45}
  h1{font-size:1.7rem}
  .page{padding:20px 16px 40px}
  .topbar{padding:8px 12px}
  .stagebox{grid-template-columns:1fr}
  .phases{grid-template-columns:1fr}
  .oth-row{grid-template-columns:1fr}
  .gl li{grid-template-columns:1fr}
  .depth>div{grid-template-columns:1fr}
  .core-item{padding-left:14px}
  .guide{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion: reduce){
  .fc{transition:none}
  .rail{transition:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<noscript><p style="padding:20px">This study path needs JavaScript to run.</p></noscript>
<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Study path navigation"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="iconbtn" id="pathbtn" aria-controls="rail" aria-expanded="false">Path</button>
      <div class="where" id="where" aria-live="polite"></div>
      <button class="iconbtn" id="themebtn" aria-label="Switch light or dark theme">Theme</button>
    </header>
    <main class="page" id="view" tabindex="-1"></main>
    <div class="guide" id="guide" role="region" aria-label="What to do next"></div>
  </div>
</div>
<script>

'use strict';
/* =====================================================================
   FIGURES: every diagram is generated here so it follows the theme tokens
   ===================================================================== */
const LC = 'var(--hema)', SC = 'var(--eosin)', AM = 'var(--amber)';
const svg = (w, h, label, inner, cls) => `<svg viewBox="0 0 ${w} ${h}" class="${cls || ''}" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const figure = (inner, cap) => `<figure><div class="fig">${inner}</div><figcaption>${cap}</figcaption></figure>`;
const T = (x, y, s, cls, anchor) => `<text x="${x}" y="${y}" class="${cls || 'sv-t'}" text-anchor="${anchor || 'middle'}">${s}</text>`;
const TL = (x, y, lines, cls, anchor, lh) => lines.map((s, i) => T(x, y + i * (lh || 15), s, cls || 'sv-t2', anchor)).join('');
const arrow = (x1, y1, x2, y2) => {
  const a = Math.atan2(y2 - y1, x2 - x1), s = 8;
  const p = [[x2, y2], [x2 - s * Math.cos(a - .45), y2 - s * Math.sin(a - .45)], [x2 - s * Math.cos(a + .45), y2 - s * Math.sin(a + .45)]].map(q => q.map(n => n.toFixed(1)).join(',')).join(' ');
  return `<line class="sv-arrow" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><polygon points="${p}" fill="var(--ink2)"/>`;
};

/* chromosome shapes */
const cell = (cx, cy, rx, ry) => `<ellipse class="sv-cell" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`;
const nuc = (cx, cy, r) => `<circle class="sv-nuc" cx="${cx}" cy="${cy}" r="${r}"/>`;
const sw = h => Math.max(4, h * .28);
const cX = (x, y, h, c) => `<path d="M${x - h * .3} ${y - h} L${x + h * .3} ${y + h} M${x + h * .3} ${y - h} L${x - h * .3} ${y + h}" stroke="${c}" stroke-width="${sw(h)}" stroke-linecap="round" fill="none"/><circle cx="${x}" cy="${y}" r="${Math.max(2.4, h * .11)}" fill="var(--surface)"/>`;
const cV = (x, y, h, c, up, rot) => {
  const d = up ? -1 : 1;
  const p = `<path d="M${x - h * .34} ${y - d * h} L${x} ${y} L${x + h * .34} ${y - d * h}" stroke="${c}" stroke-width="${sw(h)}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  return rot ? `<g transform="rotate(${rot} ${x} ${y})">${p}</g>` : p;
};
const rod = (x, y, h, c) => `<line x1="${x}" y1="${y - h}" x2="${x}" y2="${y + h}" stroke="${c}" stroke-width="${sw(h)}" stroke-linecap="round"/>`;
const squig = (x, y, w, c) => `<path d="M${x - w} ${y} q${w / 4} -9 ${w / 2} 0 t${w / 2} 0 t${w / 2} 0 t${w / 2} 0" stroke="${c}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
const pole = (x, y) => `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--eosin)"/><circle cx="${x}" cy="${y}" r="9" fill="none" stroke="var(--eosin)" stroke-width="1.5"/>`;
const fib = (x1, y1, x2, y2) => `<line class="sv-thin" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
const dumbbell = (cx, cy, r, w, off, vertical) => {
  const p = `M${cx} ${cy - w} C${cx + 12} ${cy - w} ${cx + off - 12} ${cy - r} ${cx + off} ${cy - r} A${r} ${r} 0 0 1 ${cx + off} ${cy + r} C${cx + off - 12} ${cy + r} ${cx + 12} ${cy + w} ${cx} ${cy + w} C${cx - 12} ${cy + w} ${cx - off + 12} ${cy + r} ${cx - off} ${cy + r} A${r} ${r} 0 0 1 ${cx - off} ${cy - r} C${cx - off + 12} ${cy - r} ${cx - 12} ${cy - w} ${cx} ${cy - w} Z`;
  return `<path class="sv-cell" d="${p}" ${vertical ? `transform="rotate(90 ${cx} ${cy})"` : ''}/>`;
};

/* ---------- 1. DNA packaging ---------- */
function figPacking() {
  let h = '';
  // panel 1: double helix
  let a = '', b = '', rungs = '';
  const N = 48;
  for (let i = 0; i <= N; i++) {
    const y = 28 + i * (140 / N), ph = i * 2 * Math.PI / 16;
    const x1 = 75 + 16 * Math.sin(ph), x2 = 75 - 16 * Math.sin(ph);
    a += (i ? 'L' : 'M') + x1.toFixed(1) + ' ' + y.toFixed(1);
    b += (i ? 'L' : 'M') + x2.toFixed(1) + ' ' + y.toFixed(1);
    if (i % 3 === 0) rungs += `<line x1="${x1.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--amber)" stroke-width="2"/>`;
  }
  h += rungs + `<path d="${a}" stroke="${LC}" stroke-width="3.5" fill="none"/><path d="${b}" stroke="${SC}" stroke-width="3.5" fill="none"/>`;
  // panel 2: DNA on histones
  [42, 80, 118, 156].forEach(y => { h += `<ellipse cx="230" cy="${y}" rx="19" ry="8" fill="none" stroke="${LC}" stroke-width="3"/><circle cx="230" cy="${y}" r="11" fill="${SC}" opacity=".9"/>`; });
  h += `<path d="M230 53 V69 M230 91 V107 M230 129 V145" stroke="${LC}" stroke-width="3"/>`;
  // panel 3: further coiling
  for (let i = 0; i < 10; i++) h += `<ellipse cx="385" cy="${34 + i * 14.5}" rx="22" ry="7" fill="none" stroke="${LC}" stroke-width="4"/>`;
  // panel 4: coil within chromosome
  for (let i = 0; i < 6; i++) h += `<ellipse cx="540" cy="${42 + i * 23}" rx="34" ry="11" fill="none" stroke="${LC}" stroke-width="8"/>`;
  // panel 5: nucleus + chromosome
  h += `<circle class="sv-nuc" cx="695" cy="95" r="66"/>` + squig(690, 52, 26, SC) + squig(700, 138, 26, SC) + cX(695, 95, 34, LC);
  [[98, 202], [256, 356], [412, 502], [584, 622]].forEach(([a, b]) => { h += arrow(a, 95, b, 95); });
  const labs = [[75, 'DNA double helix'], [230, 'DNA wrapped on histones'], [385, 'Further coiling'], [540, 'Coil within chromosome'], [695, 'Chromosome in the nucleus']];
  labs.forEach(([x, s], i) => { h += T(x, 192, s, 'sv-b') + T(x, 208, 'Level ' + (i + 1), 'sv-t2'); });
  return figure(svg(780, 218, 'DNA packaging from double helix to chromosome in five levels', h),
    'From the slide: the double helix wraps around histones, coils, coils again, and becomes a rod-shaped chromosome as the cell prepares to divide. Levels are schematic, not to scale.');
}

/* ---------- 2. chromosome anatomy ---------- */
function figChromosome() {
  let h = '';
  h += `<path d="M92 30 L120 115 L92 200" stroke="${LC}" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  h += `<path d="M148 30 L120 115 L148 200" stroke="${LC}" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".72"/>`;
  h += `<circle cx="120" cy="115" r="9" fill="${SC}" stroke="var(--surface)" stroke-width="2"/>`;
  h += `<ellipse cx="104" cy="122" rx="4" ry="8" fill="${AM}"/><ellipse cx="136" cy="122" rx="4" ry="8" fill="${AM}"/>`;
  h += `<line class="sv-thin" x1="160" y1="60" x2="198" y2="60"/>` + T(204, 64, 'Sister chromatid (one of two identical copies)', 'sv-t', 'start');
  h += `<line class="sv-thin" x1="130" y1="108" x2="198" y2="100"/>` + T(204, 104, 'Centromere: holds the sisters together', 'sv-t', 'start');
  h += `<line class="sv-thin" x1="141" y1="126" x2="198" y2="138"/>` + T(204, 142, 'Kinetochore: spindle fibers attach here', 'sv-t', 'start');
  // chromatin
  h += `<path d="M262 190 q16 -26 32 0 t32 0 t32 0 t32 0 M274 204 q14 -22 28 0 t28 0 t28 0 t28 0" stroke="${LC}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  h += T(204, 176, 'Chromatin: the less tightly coiled DNA-protein complex', 'sv-t', 'start');
  h += T(120, 222, 'Duplicated chromosome (as seen in mitosis)', 'sv-t2');
  return figure(svg(620, 232, 'Annotated duplicated chromosome showing sister chromatids, centromere, kinetochore, and loose chromatin', h),
    'Chromatin and chromosomes are the same DNA-protein material at different coiling levels. The sister chromatids appear once DNA has been copied.');
}

/* ---------- 3. karyotype strip ---------- */
function figKaryo() {
  let h = '';
  for (let i = 1; i <= 22; i++) {
    const x = 22 + (i - 1) * 32, hh = 92 - (i - 1) * (60 / 21);
    h += `<rect x="${x - 8}" y="22" width="8" height="${hh.toFixed(1)}" rx="4" fill="${LC}"/><rect x="${x + 2}" y="22" width="8" height="${hh.toFixed(1)}" rx="4" fill="${LC}" opacity=".75"/>` + T(x + 1, 132, i, 'sv-t2');
  }
  const sx = 22 + 22 * 32 + 8;
  h += `<rect x="${sx - 8}" y="22" width="10" height="70" rx="5" fill="${SC}"/><rect x="${sx + 8}" y="22" width="8" height="38" rx="4" fill="${AM}"/>` + T(sx - 3, 132, 'X', 'sv-b') + T(sx + 12, 132, 'Y', 'sv-b');
  h += `<path d="M14 142 H${22 + 21 * 32 + 12}" stroke="var(--ink2)" stroke-width="1.5"/>` + T(14 + (22 + 21 * 32 + 12 - 14) / 2, 160, '22 homologous pairs of autosomes (44 chromosomes)', 'sv-t');
  h += `<path d="M${sx - 12} 142 H${sx + 22}" stroke="var(--ink2)" stroke-width="1.5"/>` + T(sx + 6, 160, 'Sex pair', 'sv-t');
  return figure(svg(780, 172, 'Human karyotype layout: 22 autosome pairs plus the X and Y sex chromosomes', h),
    'Schematic karyotype (not a real photomicrograph). A normal human cell has 46 chromosomes: 44 autosomes in 22 pairs plus 2 sex chromosomes (XX in females, XY in males).');
}

/* ---------- 4. binary fission ---------- */
function figFission(labels) {
  const cy = 70, loop = (x, y, rx, ry) => `<ellipse cx="${x}" cy="${y}" rx="${rx || 14}" ry="${ry || 9}" fill="none" stroke="${LC}" stroke-width="3.5"/>`;
  const cap = (cx, w, hh) => `<rect x="${cx - w / 2}" y="${cy - (hh || 64) / 2}" width="${w}" height="${hh || 64}" rx="${(hh || 64) / 2}" class="sv-cell"/>`;
  let h = '';
  h += cap(62, 100) + loop(62, cy);
  h += cap(200, 100) + loop(188, cy - 3) + loop(212, cy + 3);
  h += cap(372, 168) + loop(330, cy) + loop(414, cy) + `<line x1="372" y1="${cy - 24}" x2="372" y2="${cy + 24}" stroke="${AM}" stroke-width="3" stroke-dasharray="4 3"/>`;
  h += dumbbell(556, cy, 30, 15, 36, false) + loop(520, cy) + loop(592, cy);
  h += cap(745, 56, 60) + cap(810, 56, 60) + loop(745, cy, 11, 8) + loop(810, cy, 11, 8);
  [[116, 146], [254, 284], [460, 486], [626, 712]].forEach(([a, b]) => { h += arrow(a, cy, b, cy); });
  if (labels) {
    const L = [
      [62, ['1. Start: one', 'circular chromosome']],
      [200, ['2. DNA is copied: two', 'identical chromosomes', 'attach to the membrane']],
      [372, ['3. New membrane grows', 'between the copies; cell', 'reaches about 2x its size']],
      [556, ['4. Membrane pushes in;', 'cell constricts like a', 'squeezed balloon']],
      [778, ['5. New cell wall: two', 'independent cells,', 'one chromosome each']]
    ];
    L.forEach(([x, ls]) => { h += TL(x, 128, ls, 'sv-t2', 'middle', 15); });
  }
  return svg(880, labels ? 190 : 110, 'Binary fission in five steps: DNA copied, membrane grows between copies, cell constricts, two cells result', h);
}
const figFissionFull = () => figure(figFission(true), 'Binary fission in a prokaryote: two genetically identical cells from one. Based on the slide figure and its step list.');

/* ---------- 5. Mendel P -> F1 -> F2 ---------- */
function figMendelPath() {
  const dot = (x, y, purple, lab) => `<circle cx="${x}" cy="${y}" r="15" fill="${purple ? 'var(--flower)' : 'var(--surface)'}" stroke="var(--ink2)" stroke-width="2"/>` + T(x, y + 34, lab, 'sv-gt');
  let h = '';
  h += dot(62, 66, true, 'PP') + dot(132, 66, false, 'pp') + T(97, 71, '\u00D7', 'sv-b');
  h += TL(97, 130, ['P generation', 'true-breeding parents'], 'sv-b', 'middle', 16);
  h += arrow(190, 66, 270, 66) + T(230, 52, 'cross-pollinate', 'sv-t2');
  [305, 337, 369, 401].forEach(x => { h += dot(x, 66, true, 'Pp'); });
  h += TL(353, 130, ['F1 generation', 'all purple'], 'sv-b', 'middle', 16);
  h += arrow(450, 66, 530, 66) + T(490, 52, 'self-pollinate', 'sv-t2');
  [[590, 1, 'PP'], [624, 1, 'Pp'], [658, 1, 'Pp'], [692, 0, 'pp']].forEach(([x, p, l]) => { h += dot(x, 66, p, l); });
  h += TL(641, 130, ['F2 generation', '3 purple : 1 white'], 'sv-b', 'middle', 16);
  h += T(641, 166, "Mendel's count: 705 purple : 224 white", 'sv-t2');
  return figure(svg(780, 182, 'Mendel cross: true-breeding purple and white parents give all purple F1, then three purple to one white in F2', h),
    'Modern allele letters (P = purple, p = white) applied to the slide figure. Purple is dominant, so PP and Pp both look purple.');
}

/* ---------- 6. Mendel evidence chart ---------- */
const MENDEL = [
  ['Seed color', 'yellow', 'green', 6022, 2001],
  ['Seed shape', 'round', 'wrinkled', 5474, 1850],
  ['Pod shape', 'inflated', 'constricted', 882, 299],
  ['Stem length', 'tall', 'short', 787, 277],
  ['Flower color', 'purple', 'white', 705, 224],
  ['Flower position', 'axial', 'terminal', 651, 207],
  ['Pod color', 'green', 'yellow', 428, 152]
];
function figMendelChart() {
  const x0 = 200, W = 380, rowH = 40, y0 = 46;
  let h = '';
  h += `<rect x="${x0}" y="14" width="12" height="12" fill="${LC}"/>` + T(x0 + 18, 25, 'dominant trait', 'sv-t2', 'start') + `<rect x="${x0 + 118}" y="14" width="12" height="12" fill="${SC}"/>` + T(x0 + 136, 25, 'recessive trait', 'sv-t2', 'start');
  MENDEL.forEach((r, i) => {
    const y = y0 + i * rowH, n = r[3] + r[4], p = r[3] / n, bw = W * p;
    h += T(x0 - 10, y + 15, r[0], 'sv-b', 'end') + T(x0 - 10, y + 30, 'n = ' + n.toLocaleString('en-US'), 'sv-t2', 'end');
    h += `<rect x="${x0}" y="${y + 4}" width="${bw.toFixed(1)}" height="26" fill="${LC}"/><rect x="${(x0 + bw).toFixed(1)}" y="${y + 4}" width="${(W - bw).toFixed(1)}" height="26" fill="${SC}"/>`;
    h += T(x0 + 8, y + 22, (p * 100).toFixed(1) + '%', 'sv-b', 'start').replace('class="sv-b"', 'class="sv-b" style="fill:var(--on-hema)"');
    h += T(x0 + W + 12, y + 14, r[3].toLocaleString('en-US') + ' : ' + r[4].toLocaleString('en-US'), 'sv-t', 'start') + T(x0 + W + 12, y + 30, (r[3] / r[4]).toFixed(2) + ' : 1  (' + r[1] + ' : ' + r[2] + ')', 'sv-t2', 'start');
  });
  const lx = x0 + W * .75;
  h += `<line x1="${lx}" y1="36" x2="${lx}" y2="${y0 + MENDEL.length * rowH}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 4"/>` + T(lx, 38, 'predicted 75% (3 : 1)', 'sv-b');
  return figure(svg(860, y0 + MENDEL.length * rowH + 8, 'Bar chart of Mendel F2 results for seven characteristics, each close to 75 percent dominant', h),
    "Drawn from the slides' Table 9-1 counts. Rows are sorted by sample size: the two biggest samples land closest to the 75% line, while the smaller ones wander a little more.");
}

/* ---------- 7. Cell cycle wheel (interactive) ---------- */
const WHEEL = [
  { k: 'g1', a0: 250, a1: 360, lab: 'G1', fill: 0.30, col: LC, d: '<strong>G1 (growth).</strong> Right after division the offspring cells are about half the original size. In G1 they grow to mature size. "G" stands for gap: G1 is the time gap after cell division and before DNA replication.' },
  { k: 's', a0: 0, a1: 85, lab: 'S', fill: 0.58, col: LC, d: "<strong>S (synthesis).</strong> The cell's DNA is copied. After this, every chromosome consists of two identical sister chromatids." },
  { k: 'g2', a0: 85, a1: 175, lab: 'G2', fill: 0.18, col: LC, d: '<strong>G2 (growth and preparation).</strong> The time gap after DNA synthesis and before cell division. The cell prepares to divide.' },
  { k: 'm', a0: 175, a1: 215, lab: 'M', fill: 0.5, col: 'var(--pea)', d: '<strong>Mitosis.</strong> The nucleus divides: prophase, metaphase, anaphase, telophase (Module 4).' },
  { k: 'c', a0: 215, a1: 250, lab: 'C', fill: 0.28, col: 'var(--pea)', d: '<strong>Cytokinesis.</strong> The cytoplasm divides, finishing the two daughter cells.' }
];
function figWheel() {
  const cx = 215, cy = 195, r0 = 78, r1 = 140;
  const P = (r, a) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
  let h = '';
  WHEEL.forEach(s => {
    const [x1, y1] = P(r1, s.a0), [x2, y2] = P(r1, s.a1), [x3, y3] = P(r0, s.a1), [x4, y4] = P(r0, s.a0), big = (s.a1 - s.a0) > 180 ? 1 : 0;
    h += `<path class="sv-seg" tabindex="0" role="button" data-seg="${s.k}" aria-label="${s.lab}: show details" d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r1} ${r1} 0 ${big} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${x3.toFixed(1)} ${y3.toFixed(1)} A${r0} ${r0} 0 ${big} 0 ${x4.toFixed(1)} ${y4.toFixed(1)} Z" fill="${s.col}" fill-opacity="${s.fill}"/>`;
    const [tx, ty] = P((r0 + r1) / 2, (s.a0 + s.a1) / 2);
    h += `<text x="${tx.toFixed(1)}" y="${(ty + 5).toFixed(1)}" class="sv-b" text-anchor="middle" pointer-events="none" style="font-size:16px">${s.lab}</text>`;
  });
  h += T(cx, cy - 6, 'Cell cycle', 'sv-b') + T(cx, cy + 12, 'clockwise', 'sv-t2');
  const [gx, gy] = P(r1 + 30, 305);
  h += `<circle class="sv-seg" tabindex="0" role="button" data-seg="g0" aria-label="G0: show details" cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="26" fill="var(--ink2)" fill-opacity=".22"/>` + T(gx.toFixed(1), (gy + 5).toFixed(1), 'G0', 'sv-b').replace('<text', '<text pointer-events="none"');
  const [lx, ly] = P(r1, 305);
  h += `<line class="sv-thin" x1="${lx.toFixed(1)}" y1="${ly.toFixed(1)}" x2="${(gx + 14).toFixed(1)}" y2="${(gy + 18).toFixed(1)}"/>`;
  h += T(30, 24, 'Interphase = G1 + S + G2', 'sv-t', 'start') + T(30, 42, 'Cell division = M + C', 'sv-t', 'start');
  h += arrow(cx + 40, cy + 150, cx - 10, cy + 150);
  return svg(430, 362, 'Cell cycle wheel with G1, S, G2, mitosis, cytokinesis and the G0 side branch', h, 'narrow');
}
function initWheel(root) {
  const box = root.querySelector('[data-wheel-desc]');
  const show = k => {
    const s = WHEEL.find(w => w.k === k);
    box.innerHTML = k === 'g0' ? '<strong>G0 (resting state).</strong> A cell can exit the cycle, usually from G1. In G0 it does not copy its DNA and does not prepare to divide. Many cells in the human body are in G0; for example, fully developed central nervous system cells stop dividing at maturity and normally never divide again.' : s.d;
    root.querySelectorAll('[data-seg]').forEach(e => e.classList.toggle('on', e.dataset.seg === k));
  };
  root.querySelectorAll('[data-seg]').forEach(e => {
    e.addEventListener('click', () => show(e.dataset.seg));
    e.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); show(e.dataset.seg); } });
  });
}
const wheelFig = () => ({
  html: figure(`<div data-wheel>${figWheel()}</div>`, 'Slice sizes are illustrative. Select any slice, or the G0 circle, to read what happens there.') +
    '<div class="callout note" data-wheel-desc aria-live="polite">Select a part of the wheel to see what happens there. Start with G1 and go clockwise.</div>',
  init: initWheel
});

/* ---------- 8. Stage viewers (mitosis, meiosis) ---------- */
const interphaseDraw = () => cell(180, 150, 125, 112) + nuc(180, 150, 62) + `<circle cx="206" cy="166" r="9" fill="var(--eosin)" opacity=".45"/>` +
  squig(178, 122, 24, LC) + squig(178, 140, 24, SC) + squig(172, 158, 22, SC) + squig(178, 176, 24, LC);
const MITOSIS = [
  { n: 'Before: interphase', t: 'Interphase: DNA has been copied', cnt: 'Human cell: 46 chromosomes, each already two chromatids (92 chromatids).',
    b: ['DNA was copied in S phase, so each chromosome now has two identical sister chromatids.', 'The DNA is still loosely coiled as chromatin.', 'G2 follows: the cell grows and prepares to divide.'],

function stageViewer(key, stages, cap) {
  const id = 'sv-' + key;
  return {
    html: `<div class="lab" id="${id}"><div class="stagebar" role="group" aria-label="Choose a stage">` +
      stages.map((s, i) => `<button type="button" data-i="${i}" aria-pressed="${i === 0 ? 'true' : 'false'}">${s.n}</button>`).join('') +
      `</div><div class="stagebox"><div class="fig" data-draw></div><div class="desc" aria-live="polite" data-desc></div></div><p class="src" style="margin-top:10px">${cap}</p></div>`,
    init: root => {
      const box = root.querySelector('#' + id), draw = box.querySelector('[data-draw]'), desc = box.querySelector('[data-desc]');
      const show = i => {
        const s = stages[i];
        draw.innerHTML = svg(360, 300, s.t + ' diagram', s.d(), 'narrow');
        desc.innerHTML = `<h4>${s.t}</h4><ul>${s.b.map(x => '<li>' + x + '</li>').join('')}</ul><p class="src" style="margin-top:6px">${s.cnt}</p>`;
        box.querySelectorAll('.stagebar button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === i)));
      };
      box.querySelectorAll('.stagebar button').forEach(b => b.addEventListener('click', () => show(+b.dataset.i)));
      show(0);
    }
  };
}

/* ---------- reading time ---------- */
function modMins(m) {
  const txt = [...m.core, ...m.sup].map(i => strip(i.b)).join(' ') + ' ' + m.oth.map(o => strip(o.d)).join(' ');
  const words = txt.split(/\s+/).filter(Boolean).length;
  const figs = (JSON.stringify(m).match(/\{\{(fig|pun)/g) || []).length;
  return Math.max(5, Math.round(words / 170 + figs * 0.75));
}

/* =====================================================================
   PUNNETT ENGINE
   ===================================================================== */
const TRAITS = {
  flower: { L: 'P', dom: 'purple', rec: 'white', name: 'Pea flower color (P purple, p white)' },
  coat: { L: 'B', dom: 'black', rec: 'brown', name: 'Guinea pig or rabbit coat (B black, b brown)' },
  pod: { L: 'G', dom: 'green', rec: 'yellow', name: 'Pea pod color (G green, g yellow)' },
  shape: { L: 'R', dom: 'round', rec: 'wrinkled', name: 'Pea seed shape (R round, r wrinkled)' },
  color: { L: 'Y', dom: 'yellow', rec: 'green', name: 'Pea seed color (Y yellow, y green)' }
};
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const isUp = ch => ch === ch.toUpperCase();
const norm = g => g.split('').sort((x, y) => (isUp(x) ? 0 : 1) - (isUp(y) ? 0 : 1)).join('');
const gametesOf = (kind, g) => {
  if (kind === 'mono') return [g[0], g[1]];
  const out = []; for (const x of g.slice(0, 2)) for (const y of g.slice(2)) out.push(x + y); return out;
};
const cellGeno = (kind, r, c) => kind === 'mono' ? norm(r + c) : norm(r[0] + c[0]) + norm(r[1] + c[1]);
const phenOf = (kind, trait, g) => {
  if (kind === 'mono') { const t = TRAITS[trait]; return /[A-Z]/.test(g) ? t.dom : t.rec; }
  return (/R/.test(g.slice(0, 2)) ? 'round' : 'wrinkled') + ', ' + (/Y/.test(g.slice(2)) ? 'yellow' : 'green');
};
const PCLS = { 'round, yellow': 'p-a', 'round, green': 'p-b', 'wrinkled, yellow': 'p-c', 'wrinkled, green': 'p-d' };
function punCompute(kind, trait, a, b) {
  const rows = gametesOf(kind, a), cols = gametesOf(kind, b);
  const cells = rows.map(r => cols.map(c => cellGeno(kind, r, c)));
  const flat = cells.flat(), total = flat.length;
  let genoOrder = [];
  if (kind === 'mono') { const L = TRAITS[trait].L, l = L.toLowerCase(); genoOrder = [L + L, L + l, l + l]; }
  else for (const s of ['RR', 'Rr', 'rr']) for (const y of ['YY', 'Yy', 'yy']) genoOrder.push(s + y);
  const geno = genoOrder.map(g => [g, flat.filter(x => x === g).length]).filter(x => x[1] > 0);
  let phenOrder = kind === 'mono' ? [TRAITS[trait].dom, TRAITS[trait].rec] : ['round, yellow', 'round, green', 'wrinkled, yellow', 'wrinkled, green'];
  const cls = p => kind === 'mono' ? (p === TRAITS[trait].dom ? 'p-a' : 'p-b') : PCLS[p];
  const pheno = phenOrder.map(p => [p, flat.filter(x => phenOf(kind, trait, x) === p).length, cls(p)]).filter(x => x[1] > 0);
  return { rows, cols, cells, geno, pheno, total, cls: g => cls(phenOf(kind, trait, g)) };
}
const ratioStr = (items, fmt) => {
  const g = items.map(x => x[1]).reduce(gcd);
  return items.map(x => `${x[1] / g} ${fmt(x)}`).join(' : ');
};
const pctStr = x => Number((x * 100).toFixed(2)) + '%';
function punTable(r, kind) {
  let h = `<table class="pun${kind === 'di' ? ' di' : ''}"><caption class="sr">Punnett square: top row is one parent's gametes, left column is the other parent's gametes</caption><thead><tr><th scope="col"></th>${r.cols.map(c => `<th scope="col">${c}</th>`).join('')}</tr></thead><tbody>`;
  r.cells.forEach((row, i) => { h += `<tr><th scope="row">${r.rows[i]}</th>${row.map(c => `<td class="${r.cls(c)}">${c}</td>`).join('')}</tr>`; });
  return h + '</tbody></table>';
}
function punStatic(kind, trait, a, b) {
  const r = punCompute(kind, trait, a, b);
  return `<div class="lab" style="padding:10px 14px;margin:12px 0"><p style="margin:0 0 4px"><strong><em>${a}</em> \u00D7 <em>${b}</em></strong></p>${punTable(r, kind)}
<p style="font-size:.92rem;margin:.2em 0 0;max-width:none">Genotypes: ${ratioStr(r.geno, x => `<em>${x[0]}</em>`)}.<br>Phenotypes: ${ratioStr(r.pheno, x => x[0])}.</p></div>`;
}
function punResults(r) {
  const li = (x, inner) => `<li>${inner}: ${x[1]}/${r.total} (${pctStr(x[1] / r.total)})</li>`;
  return `<div class="res"><div><h5>Genotypes</h5><ul>${r.geno.map(x => li(x, `<em>${x[0]}</em>`)).join('')}</ul><p style="font-size:.92rem;margin:.4em 0 0">Ratio: ${ratioStr(r.geno, x => `<em>${x[0]}</em>`)}</p></div>
<div><h5>Phenotypes</h5><ul>${r.pheno.map(x => li(x, `<span class="swatch ${x[2]}"></span>${x[0]}`)).join('')}</ul><p style="font-size:.92rem;margin:.4em 0 0">Ratio: ${ratioStr(r.pheno, x => x[0])}</p></div></div>
<p style="font-size:.88rem;color:var(--ink2);margin:.6em 0 0">Probability = boxes with that outcome \u00F7 ${r.total} boxes.</p>`;
}

function labInit(root) {
  const el = $('[data-lab]', root), pre = $('[data-presets]', el), ctl = $('[data-controls]', el), out = $('[data-out]', el);
  const L = { mode: 'mono', trait: 'flower', ai: 0, bi: 2, da: 'RRYY', db: 'rryy' };
  const monoOpts = t => { const U = TRAITS[t].L, l = U.toLowerCase(); return [[U + U, 'homozygous dominant'], [U + l, 'heterozygous'], [l + l, 'homozygous recessive']]; };
  const DI = ['RRYY', 'RRYy', 'RRyy', 'RrYY', 'RrYy', 'Rryy', 'rrYY', 'rrYy', 'rryy'];
  const sel = (id, label, opts, val) => `<label>${label}<select data-k="${id}">${opts.map(o => `<option value="${o[0]}"${String(o[0]) === String(val) ? ' selected' : ''}>${o[1]}</option>`).join('')}</select></label>`;
  const MONO_P = [['Ex 1: PP \u00D7 pp', 'flower', 0, 2], ['Ex 2: BB \u00D7 Bb', 'coat', 0, 1], ['Ex 3: Bb \u00D7 Bb', 'coat', 1, 1], ['Testcross: BB \u00D7 bb', 'coat', 0, 2], ['Testcross: Bb \u00D7 bb', 'coat', 1, 2]];
  const DI_P = [['Ex 1: RRYY \u00D7 rryy', 'RRYY', 'rryy'], ['Ex 2: RrYy \u00D7 RrYy', 'RrYy', 'RrYy']];
  const results = () => {
    let r;
    if (L.mode === 'mono') { const o = monoOpts(L.trait); r = punCompute('mono', L.trait, o[L.ai][0], o[L.bi][0]); }
    else r = punCompute('di', null, L.da, L.db);
    out.innerHTML = `<div style="overflow-x:auto">${punTable(r, L.mode)}</div>${punResults(r)}`;
  };
  const controls = () => {
    $$('[data-mode]', el).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === L.mode)));
    if (L.mode === 'mono') {
      const o = monoOpts(L.trait).map((x, i) => [i, `${x[0]} (${x[1]})`]);
      ctl.innerHTML = sel('trait', 'Characteristic', Object.keys(TRAITS).filter(k => k !== 'dummy').map(k => [k, TRAITS[k].name]), L.trait) + sel('ai', 'Parent 1', o, L.ai) + sel('bi', 'Parent 2', o, L.bi);
      pre.innerHTML = MONO_P.map((p, i) => `<button type="button" data-p="${i}">${p[0]}</button>`).join('');
    } else {
      const o = DI.map(g => [g, g]);
      ctl.innerHTML = sel('da', 'Parent 1 (seed shape R, seed color Y)', o, L.da) + sel('db', 'Parent 2', o, L.db);
      pre.innerHTML = DI_P.map((p, i) => `<button type="button" data-p="${i}">${p[0]}</button>`).join('');
    }
    $$('select', ctl).forEach(s => s.addEventListener('change', () => { const k = s.dataset.k; L[k] = (k === 'ai' || k === 'bi') ? +s.value : s.value; if (k === 'trait') { controls(); } results(); }));
    $$('[data-p]', pre).forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.p;
      if (L.mode === 'mono') { const p = MONO_P[i]; L.trait = p[1]; L.ai = p[2]; L.bi = p[3]; } else { L.da = DI_P[i][1]; L.db = DI_P[i][2]; }
      controls(); results();
    }));
  };
  $$('[data-mode]', el).forEach(b => b.addEventListener('click', () => { L.mode = b.dataset.mode; controls(); results(); }));
  controls(); results();
}

/* ---------- registry additions + token expansion ---------- */
FIGS.lab = () => ({ html: labHTML(), init: labInit });
function expand(html) {
  const inits = [];
  const out = html.replace(/\{\{(fig|pun):([^}]+)\}\}/g, (m, k, v) => {
    if (k === 'fig') {
      if (!FIGS[v]) throw new Error('Unknown figure token: ' + v);
      const f = FIGS[v](); if (f.init) inits.push(f.init); return f.html;
    }
    const p = v.split(':');
    return p[0] === 'mono' ? punStatic('mono', p[1], p[2], p[3]) : punStatic('di', null, p[1], p[2]);
  });
  return { html: out, inits };
}

let SESS = null;
let JUST = null;
const TABS = ['core', 'sup', 'oth'];
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

/* ---------- card statistics ---------- */
const cardsFor = (deck, scope) => CARDS.filter(c => (deck === 'mix' ? !!S.done[c.m] : c.m === deck) && SCOPES[scope].includes(c.tier));
const isDue = (c, now) => { const st = S.cards[c.id]; return !st || st.due <= now; };
const dueIn = (deck, scope) => cardsFor(deck, scope).filter(c => isDue(c, Date.now()));
const deckSeen = mid => CARDS.some(c => c.m === mid && S.cards[c.id]);
const doneCount = () => MODS.filter(m => S.done[m.id]).length;
const dueTotal = () => dueIn('mix', S.set.scope).length;
const reviewTarget = () => doneCount() >= 2 ? 'mix' : (MODS.find(m => S.done[m.id]) || {}).id;
function nextTab(mid) { return TABS.find(t => !S.visited[mid + ':' + t]) || 'core'; }

function nextStep() {
  const fresh = MODS.find(m => S.done[m.id] && !deckSeen(m.id));
  if (fresh) return { t: `Review Deck ${fresh.n}`, msg: `You finished Module ${fresh.n}. Test yourself on it now, while it is fresh.`, href: '#/review/run/' + fresh.id };
  const due = dueTotal(), undone = MODS.find(m => !S.done[m.id]);
  if (due >= 10 && reviewTarget()) return { t: `Review ${due} due cards`, msg: `${due} cards are due. Clear them before adding new material.`, href: '#/review/run/' + reviewTarget() };
  if (undone) {
    const started = MODS.some(m => S.visited[m.id + ':core']);
    return { t: started ? `Continue Module ${undone.n}` : 'Start Module 1', msg: `Next up: Module ${undone.n}, ${undone.title}.`, href: `#/learn/${undone.id}/${nextTab(undone.id)}` };
  }
  if (due > 0) return { t: `Review ${due} due cards`, msg: `All modules are done. ${due} cards are due.`, href: '#/review/run/mix' };
  return { t: 'Open the review hub', msg: 'All modules are done and nothing is due. Come back when cards fall due.', href: '#/review' };
}

const setWhere = h => { $('#where').innerHTML = h; };

/* ---------- REVIEW HUB ---------- */
function viewReview() {
  document.title = 'Review with flashcards';
  const scope = S.set.scope, n = doneCount(), now = Date.now();
  const box = [0, 0, 0, 0, 0, 0];
  CARDS.forEach(c => { if (S.done[c.m]) { const st = S.cards[c.id]; box[st ? st.b : 0]++; } });
  const mx = Math.max(1, ...box);
  const blabel = ['New', 'Box 1: due now', 'Box 2: 1 day', 'Box 3: 3 days', 'Box 4: 7 days', 'Box 5: 14 days'];
  const decks = MODS.map(m => {
    const open = !!S.done[m.id], all = cardsFor(m.id, scope), due = all.filter(c => isDue(c, now));
    const all2 = CARDS.filter(c => c.m === m.id && SCOPES[scope].includes(c.tier));
    const mast = all2.filter(c => (S.cards[c.id] || { b: 0 }).b >= 4).length;
    if (!open) return `<li class="deck lockd"><div><h3>Deck ${m.n}: ${m.title}</h3><div class="stats">${all2.length} cards in this scope. Opens when you finish Module ${m.n}.</div></div><a class="btn sm ghost" href="#/learn/${m.id}/${nextTab(m.id)}">Go to Module ${m.n}</a></li>`;
    return `<li class="deck"><div><h3>Deck ${m.n}: ${m.title}</h3><div class="stats">${all2.length} cards, ${due.length} due, ${mast} in boxes 4 and 5${JUST === m.id ? ' (just unlocked)' : ''}</div></div>${due.length ? `<a class="btn sm" href="#/review/run/${m.id}">Review ${due.length} due</a>` : `<a class="btn sm ghost" href="#/review/run/${m.id}/all">Practice anyway</a>`}<div class="bar" role="img" aria-label="${mast} of ${all2.length} mastered"><i style="width:${all2.length ? mast / all2.length * 100 : 0}%"></i></div></li>`;
  }).join('');
  const mixDue = dueIn('mix', scope).length;
  const mixCard = n >= 2
    ? `<li class="deck"><div><h3>Mixed review: all finished modules, interleaved</h3><div class="stats">${cardsFor('mix', scope).length} cards, ${mixDue} due. Shuffling modules together trains you to tell similar ideas apart.</div></div>${mixDue ? `<a class="btn sm" href="#/review/run/mix">Review ${mixDue} due</a>` : `<a class="btn sm ghost" href="#/review/run/mix/all">Practice anyway</a>`}</li>`
    : `<li class="deck lockd"><div><h3>Mixed review</h3><div class="stats">Opens after you finish two modules.</div></div></li>`;
  const banner = JUST ? `<div class="callout link"><p><strong>Module ${MOD(JUST).n} is exposed.</strong> Test yourself on it now, while it is fresh. A first retrieval soon after reading is what the scheduler builds on.</p></div>` : '';
  mount(`<p class="kicker">Phase 2 of 3</p><h1>Review with flashcards</h1>
<p class="lede">This is where you test yourself. Read the question, answer from memory (say it, or type it), flip, then rate yourself honestly.</p>
${banner}
<div class="callout note"><p><strong>How the scheduler works.</strong> Cards live in five boxes. "Got it" moves a card up a box and delays its return (1, 3, 7, then 14 days). "Missed" sends it to Box 1. Cards you miss come back a few cards later in the same session. Sessions are capped at 20 cards.</p></div>
<h2 style="margin-top:26px">Choose how deep to go</h2>
<div class="chips" role="group" aria-label="Card scope">${Object.keys(SCOPES).map(k => `<button type="button" data-scope="${k}" aria-pressed="${k === scope}">${SCOPE_LABEL[k]}</button>`).join('')}</div>
<p style="font-size:.95rem">Start with <strong>Core only</strong>. Add Supporting after a few sessions, and Everything once Core feels easy.</p>
<label style="display:flex;gap:10px;align-items:flex-start;margin:10px 0 20px;max-width:68ch"><input type="checkbox" id="typedchk" ${S.set.typed ? 'checked' : ''} style="margin-top:6px"><span>Type my answer before flipping. Slower, but producing an answer yourself tends to stick better than just thinking it.</span></label>
${n ? `<h2>Where your cards are</h2><div class="boxes" role="img" aria-label="Cards per box: ${box.map((b, i) => blabel[i] + ' ' + b).join(', ')}">${box.map((b, i) => `<div><b>${b}</b><span class="col"><i style="height:${b / mx * 100}%"></i></span>${blabel[i]}</div>`).join('')}</div>` : ''}
<h2>Decks</h2><ul class="decks">${mixCard}${decks}</ul>`);
  $$('[data-scope]').forEach(b => b.addEventListener('click', () => { S.set.scope = b.dataset.scope; save(); viewReview(); }));
  $('#typedchk').addEventListener('change', e => { S.set.typed = e.target.checked; save(); });
  setWhere('<strong>Phase 2: Review</strong> Hub');
  if (!n) setGuide({ label: 'Review opens as you learn', msg: 'Each deck unlocks when you finish its module. Start with Module 1.', acts: [{ t: 'Go to Module 1', href: '#/learn/m1/core' }] });

/* ---------- REVIEW SESSION ---------- */
function deckTitle(d) { return d === 'mix' ? 'Mixed review' : `Deck ${MOD(d).n}: ${MOD(d).title}`; }
function lockedView(msg, href, label) {
  mount(`<h1>Not open yet</h1><p class="lede">${msg}</p><p><a class="btn" href="${href}">${label}</a></p>`);
  setWhere('<strong>Phase 2: Review</strong>'); setGuide({ label: 'Expose comes first', msg, acts: [{ t: label, href }] });
}
function startSession(deck, ignoreDue) {
  const scope = S.set.scope, now = Date.now();
  let pool = cardsFor(deck, scope);
  if (!ignoreDue) pool = pool.filter(c => isDue(c, now));
  const order = { core: 0, sup: 1, oth: 2 };
  pool = deck === 'mix' ? shuffle(pool) : shuffle(pool).sort((a, b) => order[a.tier] - order[b.tier]);
  const batch = pool.slice(0, 20);
  SESS = { deck, scope, ignoreDue, queue: batch.map(c => c.id), total: batch.length, more: pool.length - batch.length, fin: new Set(), seen: {}, first: {}, flipped: false, active: true };
  if (!batch.length) { endSession(); return; }
  renderCard();
}
function renderCard() {
  const id = SESS.queue[0];
  if (!id) { endSession(); return; }
  const c = CARD(id), m = MOD(c.m), q = expand(c.q), a = expand(c.a);
  const pct = SESS.fin.size / SESS.total * 100;
  mount(`<div class="sess-head"><div class="meta"><strong>${deckTitle(SESS.deck)}</strong> (${SCOPE_LABEL[SESS.scope]})</div><div class="meta">${SESS.fin.size} of ${SESS.total} done, ${SESS.queue.length} left in queue</div></div>
<div class="bar hema" role="progressbar" aria-valuemin="0" aria-valuemax="${SESS.total}" aria-valuenow="${SESS.fin.size}" aria-label="Session progress"><i style="width:${pct}%"></i></div>
<div class="fc-wrap"><div class="fc" id="fc">
 <div class="face front" id="front"><div class="tags"><span>Module ${m.n}</span><span class="tier t-${c.tier}">${TIER_LABEL[c.tier]}</span><span>${c.type}</span></div>
  <div class="q">${q.html}</div>
  ${S.set.typed ? '<label class="sr" for="typed">Your answer</label><textarea id="typed" placeholder="Type or say your answer first"></textarea>' : ''}
  <div class="flipbar"><button type="button" class="btn" id="flip">Show answer</button><span style="font-size:.85rem;color:var(--ink2)">or press Space</span></div></div>
 <div class="face back" id="back" aria-hidden="true"><div class="tags"><span>Answer</span></div>
  <div class="typed" id="typedshow" hidden></div>
  <div class="a">${a.html}</div>
  <div class="why">${c.why ? esc(c.why) + ' ' : ''}Slides: ${c.s}</div></div>
</div></div>
<div class="rate" id="rate" hidden>
 <button type="button" class="miss" data-r="miss">Missed it<small>Key 1. Back in a few cards</small></button>
 <button type="button" class="shaky" data-r="shaky">Shaky<small>Key 2. One more look</small></button>
 <button type="button" class="got" data-r="got">Got it<small>Key 3. Moves up a box</small></button></div>`);
  $('#back').inert = true;
  $('#flip').addEventListener('click', flip);
  $$('[data-r]').forEach(b => b.addEventListener('click', () => rate(b.dataset.r)));
  setWhere(`<strong>Phase 2: Review</strong> ${deckTitle(SESS.deck)}`);
  setSessionGuide();
  const t = $('#typed'); if (t) t.focus({ preventScroll: true }); else $('#flip').focus({ preventScroll: true });
}
function setSessionGuide() {
  setGuide({
    label: SESS.deck === 'mix' ? 'Mixed review: modules are interleaved on purpose' : 'Review',
    msg: SESS.flipped ? 'Rate honestly. Missed cards return in a few cards; "Got it" lengthens the gap before you see the card again.' : 'Answer from memory first, aloud or typed, then flip. Peeking early weakens the benefit.',
    acts: [{ t: 'End session', cls: 'ghost', fn: endSession }]
  });
}
function flip() {
  if (!SESS || SESS.flipped) return;
  SESS.flipped = true;
  const t = $('#typed'), show = $('#typedshow');
  if (t && t.value.trim()) { show.hidden = false; show.innerHTML = '<b>Your answer:</b> ' + esc(t.value.trim()); }
  $('#fc').classList.add('flipped');
  $('#front').setAttribute('aria-hidden', 'true'); $('#front').inert = true;
  $('#back').removeAttribute('aria-hidden'); $('#back').inert = false;
  $('#rate').hidden = false;
  setSessionGuide();
  $('[data-r="got"]').focus({ preventScroll: true });
}
function rate(r) {
  if (!SESS || !SESS.flipped) return;
  const id = SESS.queue.shift();
  SESS.seen[id] = (SESS.seen[id] || 0) + 1;
  if (!(id in SESS.first)) {
    SESS.first[id] = r;
    const st = S.cards[id] || { b: 1, due: 0, n: 0, l: 0 };
    st.n++;
    if (r === 'got') st.b = Math.min(5, st.b + 1);
    else if (r === 'miss') { st.b = 1; st.l++; }
    st.due = Date.now() + (r === 'miss' ? 0 : INTERVALS[st.b] * DAY);
    S.cards[id] = st; save();
  }
  if (r === 'got') SESS.fin.add(id);
  else if (r === 'shaky') { if (SESS.seen[id] >= 2) SESS.fin.add(id); else SESS.queue.push(id); }
  else { if (SESS.seen[id] >= 3) SESS.fin.add(id); else SESS.queue.splice(Math.min(3, SESS.queue.length), 0, id); }
  SESS.flipped = false;
  renderCard();
  window.scrollTo(0, 0);
}
function endSession() {
  if (!SESS) return;
  const s = SESS, vals = Object.values(s.first), cnt = k => vals.filter(v => v === k).length;
  const nowDue = dueIn(s.deck, s.scope).length;
  const undone = MODS.find(m => !S.done[m.id]);
  s.active = false;
  if (!vals.length) {
    mount(`<h1>Nothing due in this deck</h1><p class="lede">Every card here is scheduled for later. Reviewing before a card is due works, but spaced practice works better.</p><p><a class="btn" href="#/review/run/${s.deck}/all">Practice anyway</a> <a class="btn ghost" href="#/review">Back to the hub</a></p>`);
    setWhere('<strong>Phase 2: Review</strong>'); setGuide({ label: 'All caught up', msg: 'Nothing is due here. Move on to new material or come back later.', acts: undone ? [{ t: `Module ${undone.n}`, href: `#/learn/${undone.id}/${nextTab(undone.id)}` }] : [{ t: 'Back to the hub', href: '#/review' }] });
    SESS = null; return;
  }
  const soon = Object.keys(s.first).map(id => S.cards[id].due).filter(d => d > Date.now()).sort()[0];
  mount(`<p class="kicker">Session complete</p><h1>${vals.length} card${vals.length === 1 ? '' : 's'} reviewed</h1>
<div class="tbl" style="max-width:420px"><table><tbody><tr><td>Got it first time</td><td class="num"><strong>${cnt('got')}</strong></td></tr><tr><td>Shaky</td><td class="num"><strong>${cnt('shaky')}</strong></td></tr><tr><td>Missed</td><td class="num"><strong>${cnt('miss')}</strong></td></tr></tbody></table></div>
<p>${cnt('miss') + cnt('shaky') ? 'Cards you missed or found shaky are due again soon; that is the system working.' : 'Clean run. Those cards now wait longer before they come back.'}${soon ? ` The next of these cards is due ${soon - Date.now() < DAY * 1.5 ? 'tomorrow' : 'in about ' + Math.round((soon - Date.now()) / DAY) + ' days'}.` : ''}</p>
${s.more > 0 ? `<p>${s.more} more card${s.more === 1 ? ' is' : 's are'} due in this deck. A second batch right now helps less than coming back later, but it is your call.</p>` : ''}`);
  setWhere('<strong>Phase 2: Review</strong> Done');
  const acts = [];
  if (nowDue > 0) acts.push({ t: `Next batch (${Math.min(20, nowDue)})`, cls: 'ghost', fn: () => startSession(s.deck, false) });
  acts.push(undone ? { t: `Module ${undone.n}`, href: `#/learn/${undone.id}/${nextTab(undone.id)}` } : { t: 'Review hub', href: '#/review' });
  setGuide({ label: 'What now', msg: undone ? `Keep going: Module ${undone.n} is next. Come back to Review for due cards in a day or two.` : 'All modules are done. Return when cards fall due.', acts });
  SESS = null;
}
document.addEventListener('keydown', e => {
  if (!SESS || !SESS.active) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (!SESS.flipped) {
    if ((e.key === ' ' && tag !== 'textarea' && tag !== 'button') || (e.key === 'Enter' && (e.ctrlKey || e.metaKey))) { e.preventDefault(); flip(); }
  } else if (['1', '2', '3'].includes(e.key) && tag !== 'textarea') { e.preventDefault(); rate(['miss', 'shaky', 'got'][+e.key - 1]); }
});

/* ---------- REFERENCE ---------- */
const REF_TABS = [['gloss', 'Glossary'], ['map', 'Coverage map'], ['notes', 'Notes on the source'], ['evidence', 'Evidence']];
function refNav(cur) { return `<div class="refnav">${REF_TABS.map(([k, t]) => `<a href="#/ref/${k}"${k === cur ? ' aria-current="page"' : ''}>${t}</a>`).join('')}</div>`; }
function viewRef(sub) {
  sub = REF_TABS.some(t => t[0] === sub) ? sub : 'gloss';
  document.title = 'Reference: ' + REF_TABS.find(t => t[0] === sub)[1];
  let html = `<p class="kicker">Phase 3 of 3</p><h1>Reference</h1>${refNav(sub)}`;
  if (sub === 'gloss') {
    html += `<p>${GLOSS.length} terms from both decks. Each links to the module that teaches it.</p><label class="sr" for="gs">Search the glossary</label><input id="gs" class="gloss-search" type="search" placeholder="Search terms or definitions"><ul class="gl" id="gl">${GLOSS.map(g => `<li data-t="${esc((g[0] + ' ' + strip(g[1])).toLowerCase())}"><b>${g[0]}</b><span>${g[1]}<span class="where"><a href="#/learn/${g[2]}/core">Module ${MOD(g[2]).n}</a>, slides ${g[3]}</span></span></li>`).join('')}</ul><p id="gnone" hidden>No matching terms.</p>`;
  } else if (sub === 'map') {
    html += `<p>Every slide in both decks is accounted for. "CR" is Cell Reproduction (53 slides); "GB" is Genetics and Biotechnology (67 slides).</p><div class="tbl"><table><thead><tr><th>Deck</th><th>Slides</th><th>Content</th><th>Module</th><th>Where it sits</th></tr></thead><tbody>${COVER.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3] ? r[3].split(', ').map(x => `<a href="#/learn/${x}/core">${MOD(x).n}</a>`).join(', ') : ''}</td><td>${r[4]}</td></tr>`).join('')}</tbody></table></div>
<h2>What is in the path</h2><div class="tbl"><table><thead><tr><th>Module</th><th class="num">Core items</th><th class="num">Supporting items</th><th class="num">Others items</th><th class="num">Core cards</th><th class="num">Supporting cards</th><th class="num">Others cards</th></tr></thead><tbody>${MODS.map(m => { const k = t => CARDS.filter(c => c.m === m.id && c.tier === t).length; return `<tr><td><a href="#/learn/${m.id}/core">${m.n}. ${m.title}</a></td><td class="num">${m.core.length}</td><td class="num">${m.sup.length}</td><td class="num">${m.oth.length}</td><td class="num">${k('core')}</td><td class="num">${k('sup')}</td><td class="num">${k('oth')}</td></tr>`; }).join('')}<tr><td><strong>Total</strong></td><td class="num">${MODS.reduce((n, m) => n + m.core.length, 0)}</td><td class="num">${MODS.reduce((n, m) => n + m.sup.length, 0)}</td><td class="num">${MODS.reduce((n, m) => n + m.oth.length, 0)}</td><td class="num">${CARDS.filter(c => c.tier === 'core').length}</td><td class="num">${CARDS.filter(c => c.tier === 'sup').length}</td><td class="num">${CARDS.filter(c => c.tier === 'oth').length}</td></tr></tbody></table></div>`;
  } else if (sub === 'notes') {
    html += `<p>Places where the slides are loose, inconsistent or wrong, and what this path does about each.</p><ul class="notes">${NOTES.map(n => `<li><h3>${n[0]}</h3><p>${n[1]}</p></li>`).join('')}</ul>
<h2>Everything here that goes beyond the slides</h2><ul>${BEYOND.map(b => `<li>${b}</li>`).join('')}</ul>`;
  } else {
    html += `<p>The way this path is built follows published research on how people learn. Findings differ by task and learner, so treat these as good bets, not guarantees.</p><div class="tbl"><table><thead><tr><th>Principle</th><th>What research found</th><th>Where it shows up here</th><th>Sources</th></tr></thead><tbody>${EVID.map(r => `<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>
<h2>References</h2><ul class="refs">${REFS.map(r => `<li>${r}</li>`).join('')}</ul>`;
  }
  mount(html);
  if (sub === 'gloss') {
    $('#gs').addEventListener('input', e => {
      const v = e.target.value.trim().toLowerCase(); let shown = 0;
      $$('#gl li').forEach(li => { const ok = !v || li.dataset.t.includes(v); li.hidden = !ok; if (ok) shown++; });
      $('#gnone').hidden = shown > 0;
    });
  }
  setWhere('<strong>Reference</strong> ' + REF_TABS.find(t => t[0] === sub)[1]);
  const ns = nextStep(); setGuide({ label: 'Back on the path', msg: ns.msg, acts: [{ t: ns.t, href: ns.href }] });
}

/* ---------- RAIL ---------- */
function renderRail(r) {
  const mods = MODS.map(m => {
    const vis = TABS.filter(t => S.visited[m.id + ':' + t]).length, st = S.done[m.id] ? 'done' : vis ? 'half' : '';
    const on = r[0] === 'learn' && r[1] === m.id;
    return `<li><a href="#/learn/${m.id}/${nextTab(m.id)}"${on ? ' aria-current="page"' : ''}><span class="dot ${st}"></span><span>${m.n}. ${m.title}</span><span class="meta">${S.done[m.id] ? 'done' : modMins(m) + ' min'}</span></a></li>`;
  }).join('');
  const n = doneCount(), due = dueTotal();
  $('#rail').innerHTML = `<p class="brand">Cell Reproduction and Genetics</p><p class="brand-sub">Study path from two slide decks</p>
<ul class="nav"><li><a href="#/start"${r[0] === 'start' ? ' aria-current="page"' : ''}><span class="dot ${n ? 'done' : ''}"></span><span>Start and plan</span></a></li></ul>
<h2>Phase 1: Expose</h2><p class="phase-note">Read in order. ${n} of ${MODS.length} done.</p><ul class="nav">${mods}</ul>
<h2>Phase 2: Review</h2><p class="phase-note">Flashcards. Decks open as you finish modules.</p><ul class="nav"><li><a href="#/review"${r[0] === 'review' ? ' aria-current="page"' : ''}><span class="dot ${n ? '' : 'lock'}"></span><span>Review hub</span><span class="meta">${n ? due + ' due' : 'locked'}</span></a></li></ul>
<h2>Phase 3: Reference</h2><ul class="nav">${REF_TABS.map(([k, t]) => `<li><a href="#/ref/${k}"${r[0] === 'ref' && (r[1] || 'gloss') === k ? ' aria-current="page"' : ''}><span class="dot"></span><span>${t}</span></a></li>`).join('')}</ul>`;
}

/* ---------- ROUTER ---------- */
function route() {
  const r = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  if (!r[0]) r[0] = 'start';
  if (SESS && !(r[0] === 'review' && r[1] === 'run')) SESS.active = false;
  try {
    if (r[0] === 'learn') viewLearn(r[1], r[2]);
    else if (r[0] === 'review' && r[1] === 'run') {
      const d = r[2];
      if (d === 'mix') { if (doneCount() < 2) lockedView('Mixed review opens after you finish two modules.', '#/review', 'Back to the hub'); else startSession('mix', r[3] === 'all'); }
      else if (!MOD(d)) location.hash = '#/review';
      else if (!S.done[d]) lockedView(`Deck ${MOD(d).n} opens when you finish Module ${MOD(d).n}. Expose comes before Review.`, `#/learn/${d}/${nextTab(d)}`, `Go to Module ${MOD(d).n}`);
      else startSession(d, r[3] === 'all');
    }
    else if (r[0] === 'review') viewReview();
    else if (r[0] === 'ref') viewRef(r[1]);
    else viewStart();
  } catch (err) {
    console.error(err);
    $('#view').innerHTML = `<h1>Something went wrong</h1><p>This page could not be drawn. Go back to <a href="#/start">the start page</a>.</p>`;
  }
  renderRail(r);
  $('#rail').classList.remove('open'); $('#scrim').classList.remove('on'); $('#pathbtn').setAttribute('aria-expanded', 'false');
  if (!(r[0] === 'review' && r[1] === 'run')) { window.scrollTo(0, 0); }
}

/* ---------- boot ---------- */
function applyTheme() { if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); }
$('#themebtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  S.theme = cur === 'dark' ? 'light' : 'dark'; applyTheme(); save();
});
$('#pathbtn').addEventListener('click', () => { const o = $('#rail').classList.toggle('open'); $('#scrim').classList.toggle('on', o); $('#pathbtn').setAttribute('aria-expanded', String(o)); });
$('#scrim').addEventListener('click', () => { $('#rail').classList.remove('open'); $('#scrim').classList.remove('on'); $('#pathbtn').setAttribute('aria-expanded', 'false'); });
applyTheme();
window.addEventListener('hashchange', route);
route();

</script>
